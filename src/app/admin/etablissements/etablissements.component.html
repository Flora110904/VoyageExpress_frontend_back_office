<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-3xl font-bold text-gray-900">🏨 Établissements d'Hébergement</h1>
      <p class="text-gray-600 mt-1">Gérez tous les partenaires hébergement</p>
    </div>
    <button class="btn btn-primary" (click)="openAddModal()">➕ Nouvel établissement</button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let etablissement of etablissements" class="card hover:shadow-xl transition-all">
      <div class="flex items-center gap-4 mb-4">
        <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center text-4xl shadow-lg">
          🏨
        </div>
        <div class="flex-1">
          <h3 class="font-bold text-gray-900 text-lg">{{ etablissement.nom }}</h3>
          <span class="text-xs px-2 py-1 bg-orange-100 text-orange-700 rounded-full font-semibold">
            {{ etablissement.type }}
          </span>
        </div>
        <span class="w-2 h-2 bg-green-500 rounded-full"></span>
      </div>
      <p class="text-sm text-gray-600 mb-4">📍 {{ etablissement.adresse }}</p>
      <div class="bg-orange-50 rounded-lg p-4">
        <p class="text-xs text-orange-600 font-medium mb-1">Type</p>
        <p class="text-xl font-bold text-orange-700">{{ etablissement.type }}</p>
      </div>
      <div class="flex gap-2 mt-4 pt-4 border-t border-gray-200">
        <button (click)="openDetailModal(etablissement)" class="flex-1 btn btn-secondary text-sm">👁️ Voir</button>
        <button (click)="openEditModal(etablissement)" class="flex-1 btn btn-primary text-sm">✏️ Modifier</button>
        <button (click)="openDeleteConfirm(etablissement)" class="px-3 py-2 text-red-600 hover:bg-red-50 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Form Modal -->
<app-etablissement-form-modal 
  [isOpen]="isModalOpen"
  [etablissement]="selectedEtablissement"
  (closed)="closeModal()"
  (saved)="onEtablissementSaved($event)">
</app-etablissement-form-modal>

<!-- Detail Modal -->
<app-etablissement-detail-modal
  [isOpen]="isDetailModalOpen"
  [etablissement]="etablissementToView"
  (closed)="closeDetailModal()"
  (editRequested)="onEditFromDetail($event)">
</app-etablissement-detail-modal>

<!-- Confirm Delete Modal -->
<app-confirm-modal
  [isOpen]="isConfirmModalOpen"
  [title]="'Supprimer l\'établissement'"
  [message]="'Êtes-vous sûr de vouloir supprimer ' + (etablissementToDelete?.nom || etablissementToDelete?.adresse) + ' ? Cette action est irréversible.'"
  [confirmText]="'Supprimer'"
  [cancelText]="'Annuler'"
  [icon]="'🗑️'"
  [type]="'danger'"
  [loading]="confirmModalLoading"
  [errorMessage]="confirmModalError"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()">
</app-confirm-modal>
